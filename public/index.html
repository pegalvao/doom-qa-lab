<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Doom Portfolio - Homologação</title>
    <!-- CDN Estável e Garantida via jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/js-dos@6.22.6/dist/js-dos.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@6.22.6/dist/js-dos.css">
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #dos {
            width: 640px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid #555;
        }
    </style>
</head>
<body>
    <h1>Ambiente de Homologação: Doom WebAssembly</h1>
    <p>Status: Carregando emulador WebAssembly...</p>
    
    <!-- Elemento Canvas/Container do jogo -->
    <div id="dos"></div>

    <script>
        // Aponta explicitamente os binários para o jsDelivr
        Dos(document.getElementById("dos"), {
            wdosboxUrl: "https://cdn.jsdelivr.net/npm/js-dos@6.22.6/dist/wdosbox.js"
        }).ready((fs, main) => {
            fs.extract("doom1.wad").then(() => {
                main(["-c", "DOOM1.EXE"]);
            });
        });
    </script>
</body>
</html>
