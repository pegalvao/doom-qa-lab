<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Ambiente de Homologação: Doom WebAssembly</title>
    
    <!-- 1. ELIMINAR O ERRO 404 DO FAVICON -->
    <link rel="icon" href="data:,">

    <!-- Dependências do js-dos -->
    <script src="js-dos.js"></script>
    <link rel="stylesheet" href="js-dos.css">

    <style>
        #dos {
            width: 640px;
            height: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div id="dos"></div>

    <!-- CÓDIGO JAVASCRIPT -->
    <script>
        
        const canvasElement = document.createElement('canvas');
        const ctx = canvasElement.getContext('2d', { willReadFrequently: true });

        Dos(document.getElementById("dos"), {
            wdosboxUrl: "wdosbox.js"
        }).ready((dos) => {
            
            const unlockAudio = () => {
                if (dos.audioContext && dos.audioContext.state === 'suspended') {
                    dos.audioContext.resume().then(() => {
                        console.log('AudioContext ativado com sucesso.');
                    });
                }
                window.removeEventListener('click', unlockAudio);
                window.removeEventListener('keydown', unlockAudio);
            };

            window.addEventListener('click', unlockAudio);
            window.addEventListener('keydown', unlockAudio);

            dos.run("doom_dos.ZIP");
        });
    </script>
</body>
</html>
