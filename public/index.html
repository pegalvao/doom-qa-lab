<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Doom Portfolio - Homologação</title>
    <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #dos {
            width: 640px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid #555;
        }
    </style>
</head>
<body>
    <h1>Ambiente de Homologação: Doom WebAssembly</h1>
    <p>Status: Executando no navegador via WebAssembly</p>
    
    <canvas id="dos"></canvas>

    <script>
        Dos(document.getElementById("dos"), {
            wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js"
        }).ready((fs, main) => {
            // Extrai o arquivo ZIP completo contendo o executável e o WAD
            fs.extract("doom_dos.ZIP").then(() => {
                main(["-c", "DOOM.EXE"]);
            });
        });
    </script>
</body>
</html>
